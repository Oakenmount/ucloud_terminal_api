[project]
name = "ucloud-api"
version = "0.1.0"
description = "Programmatic launcher for UCloud (cloud.sdu.dk) Terminal Ubuntu jobs with SSH access"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ucloud = "ucloud_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucloud_api"]
